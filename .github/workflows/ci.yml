name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [staging, main]

jobs:
  lint-and-unit:
    name: Lint & unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test

  full-suite:
    name: Full suite (unit + e2e + build)
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run build
      # MV3 extensions can only be loaded in headed Chromium (see
      # playwright.config.ts), and GitHub's runners have no display server,
      # so the e2e run needs a virtual one.
      - run: xvfb-run -a npm run test:e2e

  release-smoke-test:
    name: Build & package smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: store-switcheroo-extension
          path: .output/*.zip

  publish-chrome-web-store:
    name: Publish to Chrome Web Store
    needs: release-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-switcheroo-extension
          path: .output
      # Reuses the exact zip release-smoke-test just built and validated,
      # rather than rebuilding, so what's published is provably what passed
      # the smoke test.
      - name: Locate built zip
        id: zip
        run: echo "path=$(ls .output/*.zip)" >> "$GITHUB_OUTPUT"
      # chrome-webstore-upload-cli reads credentials from these exact
      # environment variable names, not CLI flags (verified against its
      # actual --help output and README, not assumed) — including
      # PUBLISHER_ID, which the newer Chrome Web Store API (v2) requires in
      # addition to the OAuth client credentials and extension id.
      - name: Upload and publish
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          npx chrome-webstore-upload-cli upload --source "${{ steps.zip.outputs.path }}"
          npx chrome-webstore-upload-cli publish
